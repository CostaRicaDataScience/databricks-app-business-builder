[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "databricks_app_business_builder"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "typer>=0.12",
  "jinja2>=3.1",
  "streamlit>=1.36",
  "databricks-sdk>=0.57.0",
]

[project.scripts]
business-builder = "composer.cli:app"
composer = "composer.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8.2", "httpx>=0.27", "ruff>=0.5"]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = [".", "src"]
include = ["modules*", "composer*"]
namespaces = true
